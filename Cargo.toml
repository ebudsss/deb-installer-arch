[workspace]
members = ["crates/core", "crates/cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ebudsss"]
repository = "https://github.com/ebudsss/deb-installer-arch"

# Build debug yang dipakai sehari-hari harus tetap cepat. Tanpa ini, seluruh
# dependency (sha2, flate2, xz2, zstd, termasuk kode C zstd-sys) dikompilasi
# dengan -O0 sehingga konversi paket besar bisa 5-10x lebih lambat.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
deb-installer-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
